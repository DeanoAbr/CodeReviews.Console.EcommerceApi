name: CI

on:
  push:
    branches: [ main, feature/ecommerce-api ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - run: dotnet restore EcommerceApi.slnx
      - run: dotnet build EcommerceApi.slnx --configuration Release --no-restore
      - run: dotnet test EcommerceApi.slnx --configuration Release --no-build --verbosity normal
